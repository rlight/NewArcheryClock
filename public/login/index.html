<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>ArcheryClock · Sign in</title>
<style>
  :root { color-scheme: dark; --bg:#0b0f14; --surface:#141a22; --border:#2a3340; --text:#e8edf3; --text-2:#9aa6b4; --accent:#8bd450; --red:#ef4444; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 20px;
         background: radial-gradient(ellipse at 50% 0%, #17202b, var(--bg) 70%); color: var(--text);
         font: 16px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  form { width: min(380px, 100%); background: var(--surface); border: 1px solid var(--border); border-radius: 20px;
         padding: 28px 24px; display: flex; flex-direction: column; gap: 14px; box-shadow: 0 30px 80px rgba(0,0,0,.45); }
  .logo { display: flex; align-items: center; gap: 10px; font-weight: 750; font-size: 18px; }
  .logo svg { width: 30px; height: 30px; }
  h1 { margin: 6px 0 0; font-size: 22px; }
  p { margin: 0; color: var(--text-2); font-size: 14px; }
  input { min-height: 52px; padding: 0 14px; border-radius: 12px; border: 1px solid var(--border); background: #0f141b;
          color: var(--text); font-size: 18px; }
  input:focus { outline: none; border-color: var(--accent); }
  button { min-height: 52px; border: 0; border-radius: 12px; background: var(--accent); color: #0b1a05; font-size: 17px; font-weight: 750; cursor: pointer; }
  button:disabled { opacity: .6; }
  .err { color: var(--red); font-size: 14px; min-height: 1.2em; }
</style>
</head>
<body>
<form id="f" autocomplete="on">
  <div class="logo"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="#f5c518"/><circle cx="12" cy="12" r="7" fill="#ef4444"/><circle cx="12" cy="12" r="4" fill="#3b8cff"/><circle cx="12" cy="12" r="1.5" fill="#fff"/></svg>ArcheryClock</div>
  <h1>Sign in</h1>
  <p>Enter the clock password to control the clock from this device.</p>
  <input id="pw" type="password" name="password" autocomplete="current-password" placeholder="Password" required autofocus>
  <div class="err" id="err" role="alert"></div>
  <button id="go" type="submit">Sign in</button>
</form>
<script>
  const next = new URLSearchParams(location.search).get('next') || '/control/';
  const safeNext = next.startsWith('/') && !next.startsWith('//') ? next : '/control/';
  document.getElementById('f').addEventListener('submit', async (e) => {
    e.preventDefault();
    const go = document.getElementById('go'), err = document.getElementById('err');
    go.disabled = true; err.textContent = '';
    try {
      const r = await fetch('/api/login', { method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ password: document.getElementById('pw').value }) });
      const j = await r.json().catch(() => ({}));
      if (r.ok) { location.replace(safeNext + location.hash); return; }
      err.textContent = j.error || 'Could not sign in.';
    } catch { err.textContent = 'The clock is not reachable.'; }
    go.disabled = false;
    document.getElementById('pw').select();
  });
</script>
</body>
</html>
